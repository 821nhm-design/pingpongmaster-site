<body>
<title>PING PONG MASTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: full-screen game canvas; HUD pinned to edges; menus float as centered panels over a live demo rally. Single committed neon-night look. */
:root{
  color-scheme:dark;
  --ink:#eef3ff; --muted:#9aa6cc; --panel:rgba(10,14,36,.86); --panel-2:rgba(255,255,255,.06); --line:rgba(140,170,255,.22);
  --ao:#2fd9cf; --beni:#ff4f8b; --gold:#ffd25e; --ok:#4fe39a; --bad:#ff6b6b;
  --f-disp:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-num:"Chakra Petch","Zen Kaku Gothic New",ui-monospace,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:#060918;color:var(--ink);font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ao);outline-offset:2px}

/* HUD */
.hud{position:absolute;inset:0;pointer-events:none}
.topbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.iconbtn{pointer-events:auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:16px;display:grid;place-items:center}
.board{display:flex;flex-direction:column;align-items:center;gap:4px}
.score{display:flex;align-items:center;gap:10px;padding:6px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-family:var(--f-num);font-weight:700}
.score .nm{font-size:12px;letter-spacing:.08em;max-width:6.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score b{font-size:24px;min-width:1.3em;text-align:center;font-variant-numeric:tabular-nums}
.score i{color:var(--muted);font-style:normal}
.pips{display:flex;gap:10px;font-family:var(--f-num);font-size:11px;color:var(--muted)}
.modetag{font-family:var(--f-num);font-size:11px;letter-spacing:.12em;color:var(--muted);text-align:right;padding-top:4px;max-width:9em}
.headline{position:absolute;left:0;right:0;top:18%;text-align:center;transition:opacity .35s,transform .35s;opacity:0;transform:translateY(8px)}
.headline.show{opacity:1;transform:none}
.headline h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:clamp(28px,8vw,52px);letter-spacing:.04em;text-shadow:0 0 18px rgba(80,200,255,.55),0 2px 0 rgba(0,0,0,.6)}
.headline small{display:block;margin-top:2px;font-family:var(--f-num);font-weight:700;letter-spacing:.2em;font-size:12px;color:var(--ao)}
.caption{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 74px);max-width:520px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;transition:opacity .3s}
.caption small{font-family:var(--f-num);font-size:10px;letter-spacing:.14em;color:var(--muted)}
.caption p{margin:2px 0 0;font-weight:700;font-size:14px}
.techbar{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:6px;overflow-x:auto;pointer-events:auto;scrollbar-width:none}
.techbar::-webkit-scrollbar{display:none}
.techbar button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 11px;font-weight:700;font-size:13px;white-space:nowrap}
.techbar button small{display:block;font-family:var(--f-num);font-size:9px;color:var(--muted);letter-spacing:.08em}
.techbar button[aria-pressed="true"]{border-color:var(--ao);background:rgba(47,217,207,.18);box-shadow:0 0 12px rgba(47,217,207,.35)}
.techbar button.req{border-color:var(--gold)}
.drillhud{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 60px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-family:var(--f-num);font-size:12px;text-align:right}
.drillhud b{font-size:20px}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-num);font-weight:700;font-size:15px;letter-spacing:.06em;pointer-events:none;text-shadow:0 0 10px currentColor,0 1px 0 #000;white-space:nowrap;animation:pop 1s ease-out forwards}
.pop small{display:block;font-family:var(--f-body);font-size:12px;color:#fff;text-align:center}
@keyframes pop{from{opacity:1;transform:translate(-50%,-50%) scale(1.15)}to{opacity:0;transform:translate(-50%,-120%) scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:1.4s}.headline{transition:none}}

/* Screens */
.screen{position:absolute;inset:0;overflow-y:auto;display:flex;justify-content:center;align-items:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,rgba(6,9,24,.35),rgba(6,9,24,.82) 55%)}
.sheet{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px}
.brand{text-align:center;padding-block:8px 2px}
.brand .eyebrow{font-family:var(--f-num);font-weight:700;letter-spacing:.32em;font-size:11px;color:var(--ao)}
.brand h1{margin:4px 0 0;font-family:var(--f-num);font-weight:700;font-size:clamp(34px,10vw,56px);letter-spacing:.06em;line-height:1;background:linear-gradient(90deg,#4ff0e6,#8f8bff 45%,#ff5fa2 80%,#ffd25e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(120,140,255,.45))}
.brand p{margin:6px 0 0;font-family:var(--f-disp);font-size:15px;letter-spacing:.12em;color:#cfe0ff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.card h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:19px;letter-spacing:.03em}
.card h3{margin:0;font-size:14px}
.hint{margin:0;font-size:12.5px;color:var(--muted);line-height:1.6}
.me{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center}
.me canvas{width:64px;height:84px;border-radius:12px;background:rgba(255,255,255,.05)}
.me .nm{font-weight:900;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .stats{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--f-num);font-size:12px;color:var(--muted)}
.me .stats b{color:var(--ink);font-size:14px}
.xpbar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ao),#8f8bff)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtn{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:84px}
.mbtn b{font-family:var(--f-disp);font-weight:400;font-size:17px}
.mbtn span{font-size:12px;color:var(--muted)}
.mbtn small{font-family:var(--f-num);font-size:10px;letter-spacing:.16em;color:var(--ao)}
.mbtn.wide{grid-column:1/-1}
.mbtn.hot{border-color:rgba(255,79,139,.6);background:linear-gradient(135deg,rgba(255,79,139,.22),rgba(10,14,36,.86) 60%)}
.mbtn.sea{border-color:rgba(47,217,207,.6);background:linear-gradient(135deg,rgba(47,217,207,.22),rgba(10,14,36,.86) 60%)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:10px 14px;font-weight:700}
.btn.pri{background:linear-gradient(90deg,#20bfb6,#5a6cff);border-color:transparent;color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.back{align-self:flex-start}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:10px 12px;text-align:left}
.item .t{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item .r{grid-row:1/3;grid-column:2;display:flex;gap:6px;align-items:center}
.kyu{font-family:var(--f-num);font-weight:700;font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.kyu.done{border-color:var(--ok);color:var(--ok)}
.kyu.master{border-color:var(--gold);color:var(--gold)}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.levels button{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:8px 0;font-family:var(--f-num);font-weight:700;font-size:13px}
.levels button.clear{border-color:var(--ok);color:var(--ok)}
.levels button:disabled{opacity:.3}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--ao);background:rgba(47,217,207,.18)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:32px;height:32px;border-radius:50%;border:2px solid transparent}
.swatches button[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px var(--ao)}
label.f,div.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
input[type=text],select{font:inherit;font-size:15px;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
select option{background:#0d1230}
.editor{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:480px){.editor{grid-template-columns:1fr}.editor .pv{justify-self:center}}
.pv canvas{width:150px;height:200px;border-radius:14px;background:radial-gradient(circle at 50% 30%,rgba(47,217,207,.18),rgba(255,255,255,.03))}
.statgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:12px;align-items:center}
.statgrid i{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--ao),#8f8bff)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:11px;color:var(--muted);font-weight:700}
.tbl td.n{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.me td{color:var(--ao);font-weight:900}
.tblwrap{overflow-x:auto}
.bracket{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12px}
.bracket .col{display:flex;flex-direction:column;gap:6px;justify-content:space-around}
.bracket .m{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--panel-2)}
.bracket .m div{display:flex;justify-content:space-between;gap:4px;overflow:hidden;white-space:nowrap}
.bracket .m .w{color:var(--ok);font-weight:900}
.bracket .m .me{color:var(--ao)}
.result h2{font-size:26px}
.big{font-family:var(--f-num);font-weight:700;font-size:40px;text-align:center;letter-spacing:.06em}
.chip{font-family:var(--f-num);font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.cpu{color:#b9a7ff;border-color:rgba(185,167,255,.5)}
.chip.on{color:var(--ok);border-color:rgba(79,227,154,.5)}
.status{font-size:13px;color:var(--muted);min-height:1.3em}
.flag{font-size:16px}
.ctlhelp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:13px}
.ctlhelp b{font-family:var(--f-num);color:var(--ao)}
</style>

<div id="app">
  <canvas id="cv" aria-label="卓球コート"></canvas>
  <div class="hud" id="hud">
    <div class="topbar">
      <button class="iconbtn" id="pauseBtn" aria-label="一時停止" hidden>Ⅱ</button>
      <div class="board" id="board" hidden>
        <div class="score"><span class="nm" id="pName">AO</span><b id="pScore">0</b><i>-</i><b id="oScore">0</b><span class="nm" id="oName">BENI</span></div>
        <div class="pips" id="pips"></div>
      </div>
      <div class="modetag" id="modeTag"></div>
    </div>
    <div class="drillhud" id="drillHud" hidden></div>
    <div class="headline" id="headline"><h2 id="hlBig"></h2><small id="hlSub"></small></div>
    <div class="caption" id="caption" hidden><small id="capWho">COACH</small><p id="capText"></p></div>
    <div class="techbar" id="techbar" hidden></div>
  </div>
  <div id="pops" class="hud"></div>
  <div class="screen" id="screen"><div class="sheet" id="sheet"></div></div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= data ================= */
const REST=.8,GRAV=9.8,KM=3.2,KS=2.0,TH=0.76,TL=1.37,TW=0.7625,NET=0.1525,BR=0.02;
const TECHS=[
  {id:'drive',name:'ドライブ',en:'DRIVE',spd:4.6,top:1.0,side:0,depth:.95,err:.10},
  {id:'power',name:'パワードライブ',en:'POWER',spd:6.0,top:1.25,side:0,depth:1.05,err:.16},
  {id:'loop',name:'ループドライブ',en:'LOOP',spd:3.2,top:1.7,side:0,depth:.95,err:.09},
  {id:'curve',name:'カーブドライブ',en:'CURVE',spd:4.4,top:.9,side:1.3,depth:.92,err:.13},
  {id:'shoot',name:'シュートドライブ',en:'SHOOT',spd:4.4,top:.9,side:-1.3,depth:.92,err:.13},
  {id:'smash',name:'スマッシュ',en:'SMASH',spd:7.2,top:.15,side:0,depth:1.0,err:.11},
  {id:'counter',name:'カウンター',en:'COUNTER',spd:5.8,top:.9,side:0,depth:1.0,err:.13},
  {id:'block',name:'ブロック',en:'BLOCK',spd:4.0,top:.15,side:0,depth:.88,err:.07},
  {id:'chiquita',name:'チキータ',en:'CHIQUITA',spd:4.4,top:1.0,side:.7,depth:.95,err:.11},
  {id:'tsutsuki',name:'ツッツキ',en:'PUSH',spd:3.3,top:-1.0,side:0,depth:.75,err:.09},
  {id:'cut',name:'カット',en:'CHOP',spd:2.9,top:-1.4,side:0,depth:1.05,err:.10},
];
const TECH=Object.fromEntries(TECHS.map(t=>[t.id,t]));
const DRILLS=[
  {id:'fdrive',name:'フォアドライブ',tech:'drive',side:'fore',feed:'top',tip:'フォア側に来る上回転を、ボールが跳ねて一番高いところで打ちます。'},
  {id:'bdrive',name:'バックドライブ',tech:'drive',side:'back',feed:'top',tip:'バック側（左）に来るボールを、体の前で打ちます。'},
  {id:'power',name:'パワードライブ',tech:'power',side:'fore',feed:'top',tip:'速くて強いドライブ。タイミングがずれるとミスしやすい技です。'},
  {id:'loop',name:'ループドライブ',tech:'loop',side:'fore',feed:'back',tip:'下回転のボールを、山なりの強い上回転で持ち上げます。'},
  {id:'curve',name:'カーブドライブ',tech:'curve',side:'fore',feed:'top',tip:'相手から見て外へ曲がっていくドライブ。'},
  {id:'shoot',name:'シュートドライブ',tech:'shoot',side:'fore',feed:'top',tip:'カーブと逆に曲がるドライブ。'},
  {id:'smash',name:'スマッシュ',tech:'smash',side:'any',feed:'lob',tip:'高く浮いたボールを上から叩きつけます。低いボールでは使えません。'},
  {id:'counter',name:'カウンター',tech:'counter',side:'any',feed:'fast',tip:'相手の速いドライブの勢いを利用して打ち返します。'},
  {id:'block',name:'ブロック',tech:'block',side:'any',feed:'fast',tip:'速いボールにラケットを合わせて、確実に返します。'},
  {id:'chiquita',name:'チキータ',tech:'chiquita',side:'back',feed:'shortback',tip:'ネット際の短い下回転を、バックで横回転をかけて払います。'},
  {id:'tsutsuki',name:'ツッツキ',tech:'tsutsuki',side:'any',feed:'back',tip:'下回転のボールを、下回転で低く返します。'},
  {id:'cut',name:'カット',tech:'cut',side:'any',feed:'top',tip:'台から離れて、強い下回転で深く返す守備の技。'},
];
const COUNTRIES=[['JPN','日本','🇯🇵'],['CHN','中国','🇨🇳'],['KOR','韓国','🇰🇷'],['TPE','台湾','🇹🇼'],['HKG','香港','🇭🇰'],['GER','ドイツ','🇩🇪'],['SWE','スウェーデン','🇸🇪'],['FRA','フランス','🇫🇷'],['GBR','イギリス','🇬🇧'],['POR','ポルトガル','🇵🇹'],['BRA','ブラジル','🇧🇷'],['USA','アメリカ','🇺🇸'],['EGY','エジプト','🇪🇬'],['NGR','ナイジェリア','🇳🇬'],['IND','インド','🇮🇳']];
const CMAP=Object.fromEntries(COUNTRIES.map(c=>[c[0],c]));
const flag=c=>(CMAP[c]||['','','🏳️'])[2];
const STYLES={
  drive:{name:'ドライブ型',desc:'ドライブ系の技が得意。パワーとスピン重視。',good:['drive','power','loop','curve','shoot'],stat:{power:5,spin:5,control:3,speed:3}},
  rush:{name:'前陣速攻型',desc:'台の近くで速く打つ。ブロック・カウンター・スマッシュが得意。',good:['block','counter','smash','chiquita'],stat:{power:4,spin:2,control:4,speed:5}},
  chop:{name:'カットマン',desc:'下回転で粘る守備型。カット・ツッツキが得意。',good:['cut','tsutsuki','block'],stat:{power:2,spin:5,control:5,speed:3}},
  all:{name:'オールラウンド',desc:'どの技も平均的に使える万能型。',good:[],stat:{power:4,spin:4,control:4,speed:4}}
};

const AU={ctx:null};
function audio(){
  if(!PROF.sound)return null;
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  if(!AU.ctx){try{AU.ctx=new(window.AudioContext||window.webkitAudioContext)();AU.out=AU.ctx.createGain();AU.out.gain.value=.6;AU.out.connect(AU.ctx.destination);
    const n=AU.ctx.sampleRate;AU.noise=AU.ctx.createBuffer(1,n,n);const d=AU.noise.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}catch(e){return null}}
  if(AU.ctx.state==='suspended')AU.ctx.resume();
  return AU.ctx;
}
function sfx(kind,vol){
  const c=AU.ctx;if(!c||!PROF.sound||c.state!=='running')return;const t=c.currentTime;vol=vol==null?1:vol;
  const tone=(f,d,g,type)=>{const o=c.createOscillator(),e=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.6,t+d);e.gain.setValueAtTime(g*vol,t);e.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(e);e.connect(AU.out);o.start(t);o.stop(t+d+.02)};
  const nz=(f,d,g,q)=>{const s=c.createBufferSource();s.buffer=AU.noise;const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q||1;const e=c.createGain();e.gain.setValueAtTime(g*vol,t);e.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(bp);bp.connect(e);e.connect(AU.out);s.start(t,Math.random()*.5);s.stop(t+d+.02)};
  if(kind==='hit'){nz(2600,.05,.9,1.2);tone(1100,.06,.35,'triangle')}
  else if(kind==='smash'){nz(1800,.09,1.2,.8);tone(700,.1,.5,'square')}
  else if(kind==='bounce'){tone(1500,.035,.35,'sine');nz(3500,.02,.25,2)}
  else if(kind==='net'){tone(180,.12,.5,'triangle')}
  else if(kind==='point'){tone(880,.18,.18,'sine');setTimeout(()=>sfx('chime2',vol),110)}
  else if(kind==='chime2'){tone(1320,.25,.16,'sine')}
  else if(kind==='cheer'){const s=c.createBufferSource();s.buffer=AU.noise;const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=900;bp.Q.value=.4;const e=c.createGain();e.gain.setValueAtTime(.0001,t);e.gain.linearRampToValueAtTime(.35*vol,t+.25);e.gain.exponentialRampToValueAtTime(.0001,t+1.6);s.connect(bp);bp.connect(e);e.connect(AU.out);s.start(t);s.stop(t+1.7)}
  else if(kind==='miss'){tone(300,.2,.25,'sawtooth')}
}

  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  const portrait=H>W*1.05;

function predictPeak(b,side){

function solveShot(f,xt,zt,T,top,side,who){

function suitability(tech,inc,fore){

function onEvent(ev,b,side){
  if(!b.live)return;
  if(GS.mode==='practice')return practiceEvent(ev,b,side);
  if(ev==='bounce'){
    sfx('bounce',.8);b.lastBounceZ=b.z;
    if(b.serve&&!b.servedOwn){if(side===b.hitter){b.servedOwn=true;return}return endPoint(other(b.hitter),'サーブミス')}
    if(side===b.hitter)return endPoint(other(b.hitter),'ミス');
    if(b.bouncedSide===side)return endPoint(b.hitter,'ツーバウンド');
    b.bouncedSide=side;b.serve=false;b.peakT=GS.time+Math.max(0,b.vy)/(GRAV+KM*b.top);
  }else if(ev==='net'){sfx('net');endPoint(other(b.hitter),'ネット')}
  else if(ev==='floor'){if(b.bouncedSide&&b.bouncedSide!==b.hitter)endPoint(b.hitter,b.bouncedSide==='p'?'取れなかった':'決まった');else endPoint(other(b.hitter),'アウト')}
}
function endPoint(winner,reason){

  if(GS.mode!=='demo'){sfx('point');if(GS.venue==='arena'&&winner==='p')sfx('cheer',.8)}
  const lastBall=GS.balls[GS.balls.length-1];
  if(GS.mode!=='demo'){
    const pn=winner==='p'?GS.pName:GS.oName;
    if(lastBall&&lastBall.hitter===winner&&(lastBall.tech==='smash'||lastBall.tech==='power')&&reason!=='ネット')say(`${pn}の${TECH[lastBall.tech].name}が決まった！`);
    else if(GS.rally>=8)say(`${GS.rally}球の長いラリー。${pn}が取った。`);
    else say(`${pn}のポイント（${reason}）`);
  }
  updateBoard();
}
function nextServer(){

  if(a>=t-1&&b>=t-1){const base=(t-1)*2;swaps=Math.floor(base/2)+(tot-base)}else swaps=Math.floor(tot/2);
  return swaps%2===0?GS.firstServer:other(GS.firstServer);
}
function gameWinner(){const[a,b]=GS.score;if(a>=GS.target&&a-b>=2)return'p';if(b>=GS.target&&b-a>=2)return'o';return null}
function afterPoint(){

  if(gw){
    GS.gameScores.push(GS.score.slice());GS.games[gw==='p'?0:1]++;
    const need=Math.ceil(GS.bestOf/2);
    if(GS.games[0]>=need||GS.games[1]>=need)return endMatch(GS.games[0]>=need?'p':'o');
    headline(`ゲーム ${GS.games[0]}-${GS.games[1]}`,'NEXT GAME');
    GS.score=[0,0];GS.firstServer=other(GS.firstServer);
  }
  GS.server=nextServer();

}
function checkCalls(){
  if(GS.mode==='demo')return;

  if(a>=t-1&&b>=t-1&&a===b)headline('デュース','DEUCE');
  else if(pg||og){const w=pg?0:1;const mp=GS.games[w]===need-1;headline(mp?'マッチポイント':'ゲームポイント',mp?'MATCH POINT':'GAME POINT')}
}

/* ================= tournament & league ================= */
let TOUR=null;
function meEntrant(){return{id:'me',name:PROF.char.name,country:PROF.char.country,rating:Math.round(PROF.rating),style:PROF.char.style,look:PROF.char,cpu:false}}
function pickField(n){
  const r=PROF.rating;const pool=ROSTER.slice().sort((a,b)=>Math.abs(a.rating-r)-Math.abs(b.rating-r)).slice(0,n+3);
  pool.sort(()=>Math.random()-.5);return pool.slice(0,n);
}
function simWin(a,b){const p=1/(1+Math.pow(10,(b.rating-a.rating)/400));const aw=Math.random()<p;return{w:aw?a:b,l:aw?b:a,score:Math.random()<.55?'2-0':'2-1'}}
function newTournament(){
  const f=pickField(7);const all=[meEntrant(),...f].sort((a,b)=>b.rating-a.rating);
  const order=[0,7,3,4,1,6,2,5];const seeded=order.map(i=>all[i]);
  TOUR={type:'tour',rounds:[[[seeded[0],seeded[1]],[seeded[2],seeded[3]],[seeded[4],seeded[5]],[seeded[6],seeded[7]]]],results:[[]],alive:true,champion:null,prize:0};
  showTour();
}
const ROUND_NAMES=['準々決勝','準決勝','決勝'];const PRIZE=[0,50000,150000,400000,1000000];
function tourMyMatch(){if(!TOUR||!TOUR.alive)return null;const r=TOUR.rounds.length-1;return TOUR.rounds[r].find(m=>m[0].id==='me'||m[1].id==='me')}
function tourPlay(){
  const m=tourMyMatch();if(!m)return;const opp=m[0].id==='me'?m[1]:m[0];const r=TOUR.rounds.length-1;
  startMatch(opp,{venue:'arena',label:'RYUKYU OPEN '+ROUND_NAMES[r],onEnd:(won)=>tourAdvance(won,opp),buttons:()=>[['大会に戻る','tour']]});
}
function tourAdvance(won,opp){
  const r=TOUR.rounds.length-1,res=[];
  for(const m of TOUR.rounds[r]){
    if(m[0].id==='me'||m[1].id==='me'){const me=m[0].id==='me'?m[0]:m[1];res.push({w:won?me:opp,l:won?opp:me,score:won?'勝':'負'})}
    else res.push(simWin(m[0],m[1]));
  }
  TOUR.results[r]=res;const lines=[];
  if(!won){TOUR.alive=false;TOUR.prize=PRIZE[r+1]||0;PROF.money+=TOUR.prize;lines.push(`${ROUND_NAMES[r]}で敗退。賞金 ¥${TOUR.prize.toLocaleString()}`)}
  else if(r===2){TOUR.alive=false;TOUR.champion='me';TOUR.prize=PRIZE[4];PROF.money+=TOUR.prize;PROF.titles++;PROF.xp+=150;lines.push(`優勝！ 賞金 ¥${TOUR.prize.toLocaleString()}　経験値 +150`)}
  else lines.push(`${ROUND_NAMES[r+1]}進出！`);
  if(r<2){const ws=res.map(x=>x.w);TOUR.rounds.push(ws.reduce((a,_,i)=>i%2?a:a.concat([[ws[i],ws[i+1]]]),[]));TOUR.results.push([])}
  if(!won&&r<2){let cur=res.map(x=>x.w);for(let rr=r+1;rr<3;rr++){const ms=cur.reduce((a,_,i)=>i%2?a:a.concat([[cur[i],cur[i+1]]]),[]);if(TOUR.rounds.length<=rr)TOUR.rounds.push(ms);const rs=ms.map(m=>simWin(m[0],m[1]));TOUR.results[rr]=rs;cur=rs.map(x=>x.w)}TOUR.champion=cur[0].name}
  return lines;
}
function newLeague(){
  const f=pickField(5);const ents=[meEntrant(),...f];
  const n=ents.length,rounds=[];const idx=ents.map((_,i)=>i);
  for(let r=0;r<n-1;r++){const pairs=[];for(let i=0;i<n/2;i++)pairs.push([ents[idx[i]],ents[idx[n-1-i]]]);rounds.push(pairs);idx.splice(1,0,idx.pop())}
  TOUR={type:'league',ents,rounds,round:0,table:Object.fromEntries(ents.map(e=>[e.id,{w:0,l:0,gw:0,gl:0}])),done:false,prize:0};
  showLeague();
}
function leagueStandings(){return TOUR.ents.slice().sort((a,b)=>{const A=TOUR.table[a.id],B=TOUR.table[b.id];return(B.w-A.w)||((B.gw-B.gl)-(A.gw-A.gl))||(b.rating-a.rating)})}
function leaguePlay(){
  const pairs=TOUR.rounds[TOUR.round];const m=pairs.find(p=>p[0].id==='me'||p[1].id==='me');const opp=m[0].id==='me'?m[1]:m[0];
  startMatch(opp,{venue:'arena',label:`リーグ 第${TOUR.round+1}節`,onEnd:(won,g)=>{
    const t=TOUR.table;t.me.w+=won?1:0;t.me.l+=won?0:1;t[opp.id].w+=won?0:1;t[opp.id].l+=won?1:0;
    t.me.gw+=g[0];t.me.gl+=g[1];t[opp.id].gw+=g[1];t[opp.id].gl+=g[0];
    for(const p of pairs){if(p[0].id==='me'||p[1].id==='me')continue;const s=simWin(p[0],p[1]);t[s.w.id].w++;t[s.l.id].l++;const[a,b]=s.score.split('-').map(Number);t[s.w.id].gw+=a;t[s.w.id].gl+=b;t[s.l.id].gw+=b;t[s.l.id].gl+=a}
    TOUR.round++;const lines=[];
    if(TOUR.round>=TOUR.rounds.length){TOUR.done=true;const pos=leagueStandings().findIndex(e=>e.id==='me')+1;const pr=[0,800000,300000,100000][pos]||0;TOUR.prize=pr;PROF.money+=pr;if(pos===1){PROF.titles++;PROF.xp+=120}lines.push(`リーグ最終順位 ${pos}位`+(pr?`　賞金 ¥${pr.toLocaleString()}`:''))}

  },buttons:()=>[['リーグ表へ','league']]});
}

/* ================= AI ================= */
function incoming(side){let best=null;for(const b of GS.balls){if(!b.live||b.res||b.hitter===side)continue;if(b.bouncedSide&&b.bouncedSide!==side)continue;if(!best||(side==='p'?b.z>best.z:b.z<best.z))best=b}return best}
function moveBody(body,tx,tz,speed,dt){const dx=tx-body.x,dz=tz-body.z,d=Math.hypot(dx,dz);if(d<1e-4)return;const st=Math.min(d,speed*dt);body.x+=dx/d*st;body.z+=dz/d*st}
const zClamp=(s,z)=>s==='p'?clamp(z,1.42,2.9):clamp(z,-2.9,-1.42);
function homeZ(s,style){const z=style==='chop'?2.45:style==='rush'?1.65:1.95;return s==='p'?z:-z}
function canHit(b,side){return b.live&&!b.res&&b.hitter!==side&&b.bouncedSide===side&&b.y>.33&&!b.netDone&&!b.floored}
function reachOK(b,body){const dx=b.x-body.x,dz=b.z-body.z;return dx*dx/(.95*.95)+dz*dz/(.8*.8)<=1}
function chooseAiTech(b,side){
  const ai=AI[side],h=b.y-TH,sp=Math.hypot(b.vx,b.vz),st=ai.style,r=Math.random();
  if(h>.55&&r<.6+ai.err*-.1+.3)return'smash';
  if(b.top<-.4){if(Math.abs(b.lastBounceZ)<.6&&st!=='chop'&&r<.4)return'chiquita';return st==='chop'||r<.45?'tsutsuki':'loop'}
  if(sp>4.8){if(st==='chop')return'cut';return r<.5?'block':'counter'}
  if(st==='chop')return r<.7?'cut':'drive';
  const opts=st==='rush'?['drive','counter','block','drive','smash']:['drive','power','curve','shoot','drive','loop'];
  return opts[Math.floor(r*opts.length)];
}
function aiUpdate(side,dt){
  const ai=AI[side],body=BODY[side];
  if(GS.state==='serve'&&GS.server===side&&!GS.serveWait){
    const b=GS.serveBall;if(b){b.x=body.x+FS(side)*.25;b.y=TH+.2+Math.abs(Math.sin((GS.time-GS.stateT)*3))*.05;b.z=body.z+DIR(side)*.15}
    if(GS.time-GS.stateT>1.0+Math.random()*.02){const kinds=['down','top','side'];doServe(side,kinds[Math.floor(Math.random()*3)],(Math.random()*2-1))}
    moveBody(body,0,homeZ(side,ai.style),ai.speed,dt);return;
  }
  const b=incoming(side);
  if(!b||GS.state!=='rally'&&GS.state!=='practice'){moveBody(body,0,homeZ(side,ai.style),ai.speed*.6,dt);return}
  if(GS.time>ai.plan||ai.forBall!==b){ai.target=predictPeak(b,side);ai.plan=GS.time+.1;if(ai.forBall!==b){ai.forBall=b;ai.swingAt=null}}
  if(ai.target&&GS.time>b.hitT+ai.react){
    const t=ai.target,fore=(t.x-body.x)*FS(side)>-.25||Math.abs(t.x)<.2;
    moveBody(body,t.x-FS(side)*(fore?.32:-.3),zClamp(side,t.z-DIR(side)*.32),ai.speed,dt);
  }

    if(GS.time>=ai.swingAt||b.vy<-2.2||b.y<.55){

      const tgtSide=-Math.sign(BODY[other(side)].x||(Math.random()-.5));
      doHit(b,side,tid,tgtSide*(.3+Math.random()*.7)*(Math.random()<.2?-1:1),qt);ai.swingAt=null;
    }
  }
}

/* ================= human input ================= */
const KEYS={};let MOUSEX=null,TOUCH=null,FINGERX=null;
function aimFromX(sx){return clamp((sx/W-.5)*2.4,-1,1)}
function requestSwing(aim){
  audio();

function humanUpdate(dt){
  const body=BODY.p,mode=ctrlMode();

  else{c.beginPath();c.arc(hx,hy,hr*1.08,Math.PI*.95,Math.PI*2.05);c.lineTo(hx+hr*.9,hy-hr*.15);c.quadraticCurveTo(hx,hy-hr*.45,hx-hr*.9,hy-hr*.15);c.fill()}
  if(st==='spiky'){for(let i=-2;i<=2;i++){const a=-Math.PI/2+i*.45;c.beginPath();c.moveTo(hx+Math.cos(a-.2)*hr,hy+Math.sin(a-.2)*hr);c.lineTo(hx+Math.cos(a)*hr*1.65,hy+Math.sin(a)*hr*1.65);c.lineTo(hx+Math.cos(a+.2)*hr,hy+Math.sin(a+.2)*hr);c.fill()}}

  if(st==='bob'){c.beginPath();c.ellipse(hx-hr*.85,hy+hr*.35,hr*.32,hr*.7,0,0,Math.PI*2);c.ellipse(hx+hr*.85,hy+hr*.35,hr*.32,hr*.7,0,0,Math.PI*2);c.fill();if(!front){c.beginPath();c.ellipse(hx,hy+hr*.5,hr*1.05,hr*.65,0,0,Math.PI*2);c.fill()}}
}

function handPos(side){

    const t=ph;hy=down?lerp(1.55,.9,t):lerp(.8,1.45,t);hz=b.z+d*lerp(-.15,.3,t);hx+=fs*(fore?lerp(.15,-.25,t):lerp(-.1,.25,t))*(tid==='block'?.3:1);

}

  else{

    c.save();c.shadowColor='#8f8bff';c.shadowBlur=14;c.strokeStyle=g;c.lineWidth=3;c.beginPath();cn.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.closePath();c.stroke();c.restore();
    const a=P(0,TH,-TL),b=P(0,TH,TL);c.strokeStyle='rgba(200,220,255,.5)';c.lineWidth=1;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke();
  }
}
function drawNet(){
  const c=ctx,beach=GS.venue==='beach';const a=P(-.915,TH,0),b=P(.915,TH,0),at=P(-.915,TH+NET,0),bt=P(.915,TH+NET,0);if(!a||!b||!at||!bt)return;
  c.fillStyle=beach?'rgba(20,20,30,.35)':'rgba(120,180,255,.12)';c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.lineTo(bt.x,bt.y);c.lineTo(at.x,at.y);c.fill();
  c.strokeStyle=beach?'rgba(30,30,40,.5)':'rgba(160,210,255,.35)';c.lineWidth=1;for(let i=0;i<=24;i++){const t=i/24;c.beginPath();c.moveTo(lerp(a.x,b.x,t),lerp(a.y,b.y,t));c.lineTo(lerp(at.x,bt.x,t),lerp(at.y,bt.y,t));c.stroke()}
  c.strokeStyle=beach?'#ffffff':'#e8f0ff';c.lineWidth=2;c.beginPath();c.moveTo(at.x,at.y);c.lineTo(bt.x,bt.y);c.stroke();
  c.strokeStyle=beach?'#333':'#9fdcff';c.lineWidth=3;for(const[p,q]of[[a,at],[b,bt]]){c.beginPath();c.moveTo(p.x,p.y);c.lineTo(q.x,q.y);c.stroke()}

function drawBall(b){
  const c=ctx;
  // shadow
  const onT=Math.abs(b.x)<=TW&&Math.abs(b.z)<=TL&&b.y>=TH;const sp=P(b.x,onT?TH+.001:0,b.z);
  if(sp){c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.ellipse(sp.x,sp.y,Math.max(2,.025*sp.s),Math.max(1,.01*sp.s),0,0,Math.PI*2);c.fill()}
  // trail
  const tr=b.trail;for(let i=1;i<tr.length;i++){const p0=P(...tr[i-1]),p1=P(...tr[i]);if(!p0||!p1)continue;const a=i/tr.length;c.strokeStyle=`hsla(${(GS.time*120+i*24)%360},100%,65%,${a*.8})`;c.lineWidth=Math.max(1,.03*p1.s*a);c.beginPath();c.moveTo(p0.x,p0.y);c.lineTo(p1.x,p1.y);c.stroke()}
  const p=P(b.x,b.y,b.z);if(!p)return;const r=Math.max(3,BR*1.6*p.s);
  c.save();c.shadowColor='#fff3c4';c.shadowBlur=12;c.fillStyle='#fff7e0';c.beginPath();c.arc(p.x,p.y,r,0,Math.PI*2);c.fill();c.restore();

function drawParticles(dt){const c=ctx;for(const q of GS.particles){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;q.vy-=4*dt;const p=P(q.x,q.y,q.z);if(!p||q.life<=0)continue;c.globalAlpha=clamp(q.life*2,0,1);c.fillStyle=q.col;c.fillRect(p.x-1.5,p.y-1.5,3,3)}c.globalAlpha=1;GS.particles=GS.particles.filter(q=>q.life>0)}
function drawPlayerAt(side){
  const b=BODY[side],L=side==='p'?(GS.pLook||PROF.char):(GS.oLook||ROSTER[0].look);const f=P(b.x,0,b.z);if(!f)return;
  const h=handPos(side),hp=P(h.x,h.y,h.z);

function render(dt){
  const c=ctx;c.save();
  if(GS.shake>0){GS.shake-=dt;c.translate((Math.random()-.5)*8*GS.shake*4,(Math.random()-.5)*8*GS.shake*4)}
  if(GS.venue==='beach')drawBeach();else drawArena();
  drawPlayerAt('o');
  drawTable();
  const far=GS.balls.filter(b=>b.z<0),near=GS.balls.filter(b=>b.z>=0);
  far.forEach(drawBall);drawNet();near.forEach(drawBall);
  drawParticles(dt);
  drawPlayerAt('p');

}

/* ================= loop ================= */
let lastT=performance.now();
function step(dt){
  GS.time+=dt;
  const hs=humanSide();
  if(GS.state==='pointEnd'&&GS.time-GS.stateT>1.5)afterPoint();
  if(GS.mode==='practice'&&GS.drill){const dr=GS.drill;if(dr.fed<dr.total&&GS.time>=dr.nextFeed){feedBall();dr.nextFeed=GS.time+Math.max(1.25,2.3-(10-dr.level)*.11)}}
  if(hs==='p')humanUpdate(dt);else aiUpdate('p',dt);
  if(GS.mode!=='practice')aiUpdate('o',dt);else{moveBody(BODY.o,0,-1.9,1,dt)}
  const sub=4,h=dt/sub;
  for(const b of GS.balls){
    if(!b.live&&!b.floored&&GS.state!=='pointEnd'&&b!==GS.serveBall)continue;
    if(b===GS.serveBall&&GS.state==='serve')continue;
    for(let i=0;i<sub;i++){const pz=integ(b,h);collide(b,pz,onEvent)}
    b.age+=dt;b.trail.push([b.x,b.y,b.z]);if(b.trail.length>14)b.trail.shift();
  }
  GS.balls=GS.balls.filter(b=>b===GS.serveBall||(b.live&&!b.res?b.age<8:b.age<3.5));
  if(GS.state==='rally'&&!GS.balls.some(b=>b.live)){const lb=GS.serveBall;GS.state='rally';endPoint(lb&&lb.bouncedSide&&lb.bouncedSide!==lb.hitter?lb.hitter:other(lb?lb.hitter:'o'),'アウト')}
}
function loop(now){
  let dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(!GS.paused){const n=Math.ceil(dt/(1/120));for(let i=0;i<n;i++)step(dt/n)}
  render(GS.paused?0:dt);
  requestAnimationFrame(loop);
}

  const online=NET_.ranking.filter(r=>r&&r.name).map(r=>({id:'on:'+r.id,name:r.name,country:r.country,rating:Math.round(r.rating||1000),style:r.style||'all',look:r.look||randLook(1),level:r.level,cpu:false,self:r.id===NET_.uid}));
  const meIn=online.some(o=>o.self);
  const rows=[...online,...ROSTER,...(meIn||!PROF.created?[]:[Object.assign(meEntrant(),{self:true,level:lvOf(PROF.xp)})])].sort((a,b)=>b.rating-a.rating);
  $('#rankBox').innerHTML=`<table class="tbl"><thead><tr><th>順位</th><th>選手</th><th></th><th>R</th><th></th></tr></thead><tbody>${rows.map((o,i)=>`<tr class="${o.self?'me':''}"><td class="n">${i+1}</td><td>${flag(o.country)} ${esc(o.name)}${o.level?` <span class="chip">Lv${o.level}</span>`:''}</td><td><span class="chip ${o.cpu?'cpu':'on'}">${o.cpu?'CPU':'ONLINE'}</span></td><td class="n">${o.rating}</td><td>${o.self?'':`<button class="btn sm" data-act="challenge" data-id="${esc(o.id)}">挑戦</button>`}</td></tr>`).join('')}</tbody></table>`;
  RANK_ROWS=rows;
}
let RANK_ROWS=[];
let ED=null;
function showEditor(){
  ED=JSON.parse(JSON.stringify(PROF.char));
  const sw=(key,arr)=>`<div class="swatches" data-key="${key}">${arr.map(c=>`<button style="background:${c}" data-val="${c}" aria-pressed="${ED[key]===c}" aria-label="${c}"></button>`).join('')}</div>`;
  const seg=(key,obj)=>`<div class="seg" data-key="${key}">${Object.entries(obj).map(([k,v])=>`<button data-val="${k}" aria-pressed="${ED[key]===k}">${esc(typeof v==='string'?v:v.name)}</button>`).join('')}</div>`;
  show('editor',`<button class="btn sm back" data-act="title">← メニュー</button>
  <div class="card"><h2>選手をつくる</h2>
  <div class="editor"><div class="pv"><canvas id="pvCanvas" data-fig="${esc(JSON.stringify(ED))}" aria-label="選手のプレビュー"></canvas></div>
  <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
    <label class="f">選手名<input type="text" id="edName" maxlength="14" value="${esc(ED.name)}"></label>
    <label class="f">国・チーム<select id="edCountry">${COUNTRIES.map(c=>`<option value="${c[0]}" ${ED.country===c[0]?'selected':''}>${c[2]} ${c[1]}（チーム${c[1]}）</option>`).join('')}</select></label>
  </div></div>
  <div class="f">プレースタイル${seg('style',STYLES)}</div><p class="hint" id="styleDesc">${esc(STYLES[ED.style].desc)}</p>
  <div class="statgrid" id="statGrid"></div>
  <div class="f">ジャケット${sw('jacket',JACKETS)}</div>
  <div class="f">パンツ${sw('pants',PANTS)}</div>
  <div class="f">髪型${seg('hair',HAIRS)}</div>
  <div class="f">髪の色${sw('hairColor',HAIRCOL)}</div>
  <div class="f">肌の色${sw('skin',SKINS)}</div>
  <div class="f">体型${seg('body',BODIES)}</div>
  <div class="f">ラバーの色${sw('rubber',RUBBERS)}</div>
  <div class="row"><button class="btn pri" data-act="edsave">この選手で決定</button><span class="status" id="edStatus"></span></div></div>`);
  renderStats();
}
function renderStats(){const s=STYLES[ED.style].stat;$('#statGrid').innerHTML=[['パワー','power'],['回転','spin'],['安定','control'],['スピード','speed']].map(([n,k])=>`<span>${n}</span><i style="width:${s[k]*20}%"></i>`).join('');$('#styleDesc').textContent=STYLES[ED.style].desc}
function redrawPreview(){const cn=$('#pvCanvas');if(cn){cn.dataset.fig=JSON.stringify(ED);drawMiniFigures()}}
function showSettings(){
  const m=[['auto','自動'],['easy','かんたん（スマホ）'],['touch','タッチ移動（iPad）'],['keys','キーボード＋マウス（PC）']];
  show('settings',`<button class="btn sm back" data-act="title">← メニュー</button>
  <div class="card"><h2>操作方法</h2><div class="seg" id="ctrlSeg">${m.map(([k,n])=>`<button data-c="${k}" aria-pressed="${PROF.ctrl===k}">${n}</button>`).join('')}</div>
  <p class="hint">「自動」は端末に合わせて選びます。いまは「${{easy:'かんたん',touch:'タッチ移動',keys:'キーボード＋マウス'}[ctrlMode()]}」です。</p>
  <div class="ctlhelp"><b>スマホ</b><span>移動は自動。ボールが跳ねたらタップ。左右にスワイプでコースを狙う。</span><b>iPad</b><span>指を左右に動かして移動。上にはじくか、タップで打つ。</span><b>PC</b><span>← → ↑ ↓（WASD）で移動。クリックかスペースで打つ。マウスの位置でコース。1〜0・−キーかQ/Eで技を切り替え。Escで一時停止。</span></div>
  <p class="hint">技は画面下のボタンで選びます。フォアかバックかは、ボールが体の右側か左側かで自動で決まります。</p></div>
  <div class="card"><h2>音</h2><div class="seg" id="sndSeg"><button data-s="1" aria-pressed="${PROF.sound}">オン</button><button data-s="0" aria-pressed="${!PROF.sound}">オフ</button></div><p class="hint">iPhoneで音が出ないときは、マナーモードを解除して音量を上げてください。</p></div>
  <div class="card"><h2>データ</h2><p class="hint">${NET_.db?'データはClaudeアカウントに保存されています。同じアカウントなら、スマホ・iPad・パソコンで続きから遊べます。':'いまはこの端末のブラウザに保存しています。Claudeにサインインして開くと、アカウントに保存されます。'}</p></div>`);
}
const GAME_URL=window.PPM_URL||'https://claude.ai/artifact/HATpVbPemWHSXyACePF9E4';
let deviceKind=function(){const ua=navigator.userAgent||'';if(/iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1))return'ipad';if(/iPhone|iPod/.test(ua))return'iphone';if(/Android/.test(ua))return'android';return'pc'};
function showInstall(){
  const k=deviceKind();
  const steps={
    ipad:['下の「リンクをコピー」を押します。','Safariを開き、アドレス欄に貼り付けて開きます（Claudeアプリの中からはホーム画面に追加できません）。','画面右上の共有ボタン（四角から上向きの矢印）を押します。','「ホーム画面に追加」を選び、名前を「PING PONG MASTER」にして「追加」を押します。','ホーム画面のアイコンから起動します。初めての時はClaudeにサインインしてください。'],
    iphone:['下の「リンクをコピー」を押します。','Safariを開き、アドレス欄に貼り付けて開きます（Claudeアプリの中からはホーム画面に追加できません）。','画面下の共有ボタン（四角から上向きの矢印）を押します。','「ホーム画面に追加」を選び、「追加」を押します。','ホーム画面のアイコンから起動します。初めての時はClaudeにサインインしてください。'],
    android:['下の「リンクをコピー」を押します。','Chromeを開き、アドレス欄に貼り付けて開きます。','右上の︙メニューを押します。','「ホーム画面に追加」を選び、「追加」を押します。','ホーム画面のアイコンから起動します。'],
    pc:['下の「リンクをコピー」を押します。','ChromeかEdgeでリンクを開きます。','ブックマークに追加するか、︙メニューの「保存して共有」→「ショートカットを作成」で、デスクトップにアイコンを作れます。MacのSafariなら「ファイル」→「Dockに追加」。','アイコンから起動します。初めての時はClaudeにサインインしてください。']
  }[k];
  const name={ipad:'iPad',iphone:'iPhone',android:'Android',pc:'パソコン'}[k];
  show('install',`<button class="btn sm back" data-act="title">← メニュー</button>
  <div class="card"><h2>ホーム画面に追加（${name}）</h2>
  <ol style="margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.6">${steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
  <label class="f">このゲームのリンク<input type="text" id="gameUrl" readonly value="${GAME_URL}"></label>
  <div class="row"><button class="btn pri" data-act="copyurl">リンクをコピー</button><span class="status" id="copyStatus"></span></div>
  <p class="hint">このリンクは今のところ持ち主しか開けません。家族や友だちのホーム画面にも置きたいときは、先に共有メニューから共有してください。成績はアカウントに保存されるので、どの端末のアイコンから開いても同じデータで遊べます。</p></div>
  <div class="card"><h3>ほかの端末の手順</h3><div class="seg">${['ipad','iphone','android','pc'].filter(x=>x!==k).map(x=>`<button data-act="installfor" data-k="${x}">${({ipad:'iPad',iphone:'iPhone',android:'Android',pc:'パソコン'})[x]}</button>`).join('')}</div></div>`);
}
function showResult(o){
  show('result',`<div class="card result" style="margin-top:12vh"><div class="big" style="color:${o.win?'var(--gold)':'var(--muted)'}">${esc(o.title)}</div><p style="text-align:center;margin:0;font-weight:700">${esc(o.sub)}</p>
  ${o.lines.filter(Boolean).map(l=>`<p class="hint" style="text-align:center">${esc(l)}</p>`).join('')}
  <div class="row" style="justify-content:center">${o.buttons.map(([n,a],i)=>`<button class="btn ${i===0?'pri':''}" data-act="${a}">${esc(n)}</button>`).join('')}</div></div>`);
}
let LAST_OPP=null,LAST_OPTS=null;
$('#sheet').addEventListener('click',e=>{
  audio();
  const sv=e.target.closest('#venueSeg button,#fmtSeg button,#ctrlSeg button,#sndSeg button');
  if(sv){const p=sv.parentElement;p.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===sv)));
    if(sv.dataset.f){PROF.fmt=sv.dataset.f;saveProfile()}if(sv.dataset.c){PROF.ctrl=sv.dataset.c;saveProfile();showSettings()}if(sv.dataset.s){PROF.sound=sv.dataset.s==='1';saveProfile()}return}
  const ed=e.target.closest('.editor ~ label .seg button, .swatches button, [data-key] button');
  if(ed&&SCREEN==='editor'){const key=ed.parentElement.dataset.key;ED[key]=ed.dataset.val;ed.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===ed)));if(key==='style')renderStats();redrawPreview();return}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(window.PPM_GATE&&['drillgo','drillAgain','drillNext','vs','rematch','tourplay','leagueplay','challenge'].includes(act)&&!window.PPM_GATE(act))return;
  switch(act){
    case'title':showTitle();break;
    case'practice':showPractice();break;
    case'drill':showDrill(a.dataset.id);break;
    case'drillgo':{const d=DRILLS.find(x=>x.id===a.dataset.id);startDrill(d,+a.dataset.lv);break}
    case'drillAgain':if(LAST_DRILL)startDrill(LAST_DRILL.d,LAST_DRILL.level);break;
    case'drillNext':if(LAST_DRILL)startDrill(LAST_DRILL.d,LAST_DRILL.level-1);break;
    case'matchmenu':showMatchMenu();break;
    case'vs':{const o=ROSTER.find(x=>x.id===a.dataset.id);const v=($('#venueSeg [aria-pressed="true"]')||{}).dataset;LAST_OPP=o;LAST_OPTS={venue:v?v.v:'arena'};startMatch(o,LAST_OPTS);break}
    case'rematch':if(LAST_OPP)startMatch(LAST_OPP,LAST_OPTS);break;
    case'tour':showTour();break;
    case'tournew':newTournament();break;
    case'tourplay':tourPlay();break;
    case'league':showLeague();break;
    case'leaguenew':newLeague();break;
    case'leagueplay':leaguePlay();break;
    case'online':showOnline();break;
    case'challenge':{const o=RANK_ROWS.find(x=>x.id===a.dataset.id);if(o){LAST_OPP=o;LAST_OPTS={venue:'arena',label:o.cpu?'RANKING':'ONLINE CHALLENGE',buttons:()=>[['ランキングへ','online'],['もう一度','rematch']]};startMatch(o,LAST_OPTS)}break}
    case'editor':showEditor();break;
    case'edsave':{ED.name=($('#edName').value||'').trim().slice(0,14)||'プレイヤー';ED.country=$('#edCountry').value;PROF.char=ED;PROF.created=true;saveProfile();showTitle();break}
    case'settings':showSettings();break;
    case'install':showInstall();break;
    case'installfor':{const real=deviceKind;deviceKind=()=>a.dataset.k;showInstall();deviceKind=real;break}
    case'copyurl':{const inp=$('#gameUrl'),st=$('#copyStatus');const fb=()=>{inp.focus();inp.select();st.textContent='選択しました。長押しして「コピー」を選んでください。'};try{const pr=navigator.clipboard&&navigator.clipboard.writeText(GAME_URL);if(pr)pr.then(()=>st.textContent='コピーしました。',fb);else fb()}catch(err){fb()}break}
    case'resume':togglePause();break;
    case'quit':GS.paused=false;GS.state='idle';GS.drill=null;exitGame();showTitle();break;
  }
});
$('#sheet').addEventListener('input',e=>{if(e.target.id==='edName'&&ED){ED.name=e.target.value}if(e.target.id==='edCountry'&&ED){ED.country=e.target.value}});

/* ================= boot ================= */
addEventListener('resize',()=>{resize();if(SCREEN)drawMiniFigures()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&GS.mode!=='demo'&&!GS.paused&&!SCREEN)togglePause()});
resize();startDemo();showTitle();requestAnimationFrame(loop);initNet();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(SCREEN)drawMiniFigures()});
</script>
<script src="gate.js"></script>
</body>
</html>
