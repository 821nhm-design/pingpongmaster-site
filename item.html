<!doctype html>
<html lang="ja" data-root="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>商品 | {shop}</title>
<meta name="description" content="商品の詳細">
<meta name="theme-color" content="#070b22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="shop.js"></script>
</head>
<body>
<main class="wrap">
  <div class="item" id="item"><p class="muted">読み込み中…</p></div>
</main>
<script>
(async()=>{
  const {esc,yen,products,CATS,S,buyUrl}=STORE;
  const id=new URLSearchParams(location.search).get('id');
  const p=(await products()).find(x=>x.id===id);
  const box=document.getElementById('item');
  if(!p){box.innerHTML='<div class="panel"><h1>商品が見つかりません</h1><p>リンクが古い可能性があります。<a href="store.html#items">ストアへ</a></p></div>';return}
  document.title=p.title+' | '+(S.name||'STORE');
  const buy=buyUrl(p);
  const isGame=p.type==='game';
  box.innerHTML=`
  <div style="display:flex;flex-direction:column;gap:18px;min-width:0">
    <div class="media">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.title)}の画像">`:''}</div>
    <div><span class="eyebrow">${esc(CATS[p.category]||'')}</span><h1 style="margin-top:6px">${esc(p.title)}</h1><p style="margin:10px 0 0">${esc(p.short||'')}</p></div>
    ${p.bullets&&p.bullets.length?`<div><h2 style="font-size:18px;margin-bottom:8px">できること</h2><ul class="points">${p.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div>`:''}
    <div><h2 style="font-size:18px;margin-bottom:8px">説明</h2><p class="desc">${esc(p.description||'')}</p></div>
    ${p.requirements?`<div><h2 style="font-size:18px;margin-bottom:8px">動作環境</h2><p class="note" style="margin:0">${esc(p.requirements)}</p></div>`:''}
  </div>
  <aside class="buybox" aria-label="購入">
    <div class="price">${p.price?yen(p.price):'無料'}<small>${p.price?'税込・買い切り':''}</small></div>
    ${isGame?`<a class="btn big" href="${esc(p.playUrl||'game/')}">まずは無料で遊ぶ（${p.freePlays||2}回まで）</a>`:''}
    ${p.price?(buy?`<a class="btn pri big" href="${esc(buy)}">購入する（カード決済）</a>`:`<button class="btn pri big" disabled>準備中（まだ購入できません）</button>`):''}
    ${S.lineUrl?`<a class="btn line" href="${esc(S.lineUrl)}" target="_blank" rel="noopener">LINEで質問する</a>`:''}
    <div class="notice"><b>ご購入前にご確認ください</b><br>
      ・お支払いはクレジットカード（Stripe）です。<br>
      ・${isGame?'支払い完了後すぐに、購入完了ページでフル版が使えるようになります。':'支払い完了後すぐに、購入完了ページからダウンロードできます。'}<br>
      ・デジタル商品のため、購入後の返品・キャンセルはできません。不具合で使えない場合は返金します。<br>
      ・購入すると<a href="legal/terms.html">利用規約</a>に同意したものとします。</div>
    <p class="note" style="margin:0"><a href="legal/tokushoho.html">特定商取引法に基づく表記</a>・<a href="legal/privacy.html">プライバシーポリシー</a></p>
  </aside>`;
})();
</script>
</body>
</html>
