<!doctype html>
<html lang="ja" data-root="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ストア | {shop}</title>
<meta name="description" content="卓球と沖縄から生まれたゲーム・学べるデジタルコンテンツのお店">
<meta name="theme-color" content="#070b22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="shop.js"></script>
</head>
<body>
<main class="wrap">
  <section class="hero" id="hero">
    <div>
      <div class="eyebrow">NEW · GAME</div>
      <h1 id="heroTitle">PING PONG MASTER</h1>
      <p class="lead" id="heroLead"></p>
      <div class="row"><a class="btn pri big" id="heroPlay" href="game/">無料で2回遊んでみる</a><a class="btn big" id="heroItem" href="item.html?id=ppm-game">くわしく見る</a></div>
      <p class="muted" style="font-size:13px;margin-top:10px">気に入ったら <b id="heroPrice" style="color:var(--gold)"></b>（買い切り）でずっと遊べます。</p>
    </div>
    <a class="shot" href="item.html?id=ppm-game"><img src="assets/ppm-cover.png" alt="PING PONG MASTERのゲーム画面。ネオンの卓球台で2人の選手が打ち合っている" width="1200" height="675"></a>
  </section>

  <section class="block" id="items">
    <div class="eyebrow">STORE</div>
    <h2>ストア</h2>
    <p class="muted" style="margin:6px 0 0">ゲーム・アプリ・資料（PDF）・プレゼン資料・動画・画像素材を販売しています。</p>
    <div class="tabs" id="tabs" role="group" aria-label="カテゴリ"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="block">
    <div class="eyebrow">HOW TO BUY</div>
    <h2>買い方</h2>
    <div class="steps">
      <div><b>1</b><h3>商品をえらぶ</h3><p class="muted" style="margin:6px 0 0">ゲームは無料で2回試せます。</p></div>
      <div><b>2</b><h3>カードで支払う</h3><p class="muted" style="margin:6px 0 0">決済は世界中で使われているStripeで行います。カード番号はこのお店には届きません。</p></div>
      <div><b>3</b><h3>すぐに使える</h3><p class="muted" style="margin:6px 0 0">支払いが終わると購入完了ページが開き、その場で使えます。領収書メールも届きます。</p></div>
    </div>
  </section>
</main>
<script>
(async()=>{
  const {esc,yen,products,CATS,S}=STORE;
  const list=await products();
  const g=list.find(p=>p.id==='ppm-game');
  if(g){document.getElementById('heroLead').textContent=g.short;document.getElementById('heroPrice').textContent=yen(g.price)}
  const soon=['document','slides','video','app','care'];
  let cur='all';
  const tabs=document.getElementById('tabs');
  const keys=['all',...Object.keys(CATS).filter(k=>k!=='other'&&(list.some(p=>p.category===k)||soon.includes(k)))];
  tabs.innerHTML=keys.map(k=>`<button data-k="${k}" aria-pressed="${k==='all'}">${k==='all'?'すべて':CATS[k]}</button>`).join('');
  tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cur=b.dataset.k;tabs.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});
  function render(){
    const items=list.filter(p=>cur==='all'||p.category===cur);
    const html=items.map(p=>`<a class="card" href="item.html?id=${encodeURIComponent(p.id)}"><div class="img">${p.image?`<img src="${esc(p.image)}" alt="" loading="lazy">`:''}</div><div class="body"><span class="cat">${esc(CATS[p.category]||'')}</span><span class="t">${esc(p.title)}</span><span class="muted" style="font-size:13px">${esc(p.short||'')}</span><span class="p">${p.price?yen(p.price):'無料'}</span></div></a>`);
    const empty=(cur==='all'?soon.filter(c=>!list.some(p=>p.category===c)):(items.length?[]:[cur])).map(c=>`<div class="card soon"><div class="img">${esc(CATS[c])}</div><div class="body"><span class="t">準備中</span><span class="muted" style="font-size:13px">${S.lineUrl?'LINEで友だち追加すると、公開したときにお知らせします。':'公開までもうしばらくお待ちください。'}</span></div></div>`);
    document.getElementById('grid').innerHTML=html.concat(empty).join('');
  }
  render();
})();
</script>
</body>
</html>
