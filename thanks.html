<!doctype html>
<html lang="ja" data-root="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ご購入ありがとうございます | {shop}</title>
<meta name="description" content="購入完了">
<meta name="theme-color" content="#070b22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="shop.js"></script>
</head>
<body>
<main class="wrap doc">
  <div class="eyebrow">THANK YOU</div>
  <h1>ご購入ありがとうございます</h1>
  <div class="panel" id="box"><p class="status">お支払いを確認しています…</p></div>
  <div class="panel" id="seller" hidden style="margin-top:14px"></div>
  <div class="panel" id="share" hidden style="margin-top:14px"></div>
  <p class="note">このページを閉じても、<a href="restore.html">購入した商品を再表示</a>からいつでも受け取り直せます（購入時のメールアドレスとカード番号の下4桁を使います）。Stripeから領収書メールも届きます。</p>
</main>
<script>
(async()=>{
  const {esc,yen,products,S}=STORE;const box=document.getElementById('box');
  const sid=new URLSearchParams(location.search).get('session_id');
  if(!sid){box.innerHTML='<p class="status err">注文番号がありません。購入直後に開いたページでない場合は「購入した商品を再表示」からお試しください。</p>';return}
  let d=null;
  for(let i=0;i<4&&!(d&&d.ok);i++){try{const r=await fetch('/api/claim?session_id='+encodeURIComponent(sid));d=await r.json()}catch(e){d=null}if(!(d&&d.ok))await new Promise(r=>setTimeout(r,1500))}
  if(!d||!d.ok){box.innerHTML=`<p class="status err">${d&&d.reason==='unpaid'?'お支払いの確認がまだ取れていません。少し待ってからこのページを再読み込みしてください。':'購入内容を確認できませんでした。お支払いは完了しています。お手数ですが、お問い合わせください。'}</p>${d&&d.reason&&d.reason!=='unpaid'?`<p class="note" style="margin:0">理由：${esc(d.reason==='not_configured'?'お店の設定（Cloudflareの STRIPE_SECRET_KEY / LICENSE_SECRET）がまだ反映されていません':d.reason==='bad_session'?'注文番号の形が正しくありません（Stripeの「支払い後」のURLに {CHECKOUT_SESSION_ID} が入っているか確認）':(d.message||d.reason))}</p>`:(!d?'<p class="note" style="margin:0">理由：お店のサーバーにつながりませんでした（Cloudflareに公開したアドレスで開いているか確認）</p>':'')}`;return}
  box.innerHTML='<p class="status ok" style="margin:0">お支払いを確認しました。</p>'+d.items.map(it=>{
    if(it.type==='game'&&it.code){try{localStorage.setItem('ppm-license',JSON.stringify({code:it.code,pid:it.pid,at:Date.now()}))}catch(e){}}
    return `<div style="display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px"><h2 style="font-size:20px">${esc(it.name)}</h2>
      ${it.type==='game'&&it.code?`<p style="margin:0">この端末は、もうフル版になっています。ほかの端末（iPadやパソコン）で遊ぶときは、この購入コードを入力してください。</p><div class="code">${esc(it.code)}</div><div class="row"><a class="btn pri big" href="${esc(it.url)}">ゲームを開く</a><button class="btn" data-copy="${esc(it.code)}">購入コードをコピー</button></div>`
      : it.url?`<p style="margin:0">下のボタンからダウンロードしてください。${d.mail?'ダウンロードが完了すると、確認のメールが届きます。':''}</p><a class="btn pri big" href="${esc(it.url)}">ダウンロードする</a>`:`<p class="status err">${esc(it.note||'')}</p>`}</div>`}).join('');
  box.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(!b)return;navigator.clipboard&&navigator.clipboard.writeText(b.dataset.copy).then(()=>b.textContent='コピーしました',()=>{})});
  const s=d.seller||{};
  const sel=document.getElementById('seller');sel.hidden=false;
  sel.innerHTML=`<h2 style="font-size:17px">販売事業者の情報</h2><table class="tbl"><tr><th>販売事業者</th><td>${esc(s.name||S.seller||'')}</td></tr><tr><th>所在地</th><td>${esc(s.address||'')}</td></tr><tr><th>電話番号</th><td>${esc(s.phone||'')}</td></tr><tr><th>お問い合わせ</th><td>${esc(s.email||S.email||'')}</td></tr></table><p class="note" style="margin:0">ご購入者様にのみお知らせしています。お問い合わせはメールでお願いします。</p>`;
  const shareUrl=encodeURIComponent(location.origin+'/');const name=d.items[0]?d.items[0].name:'';const text=encodeURIComponent(`${S.name||''}で「${name}」を手に入れました！`);
  const others=(await products()).filter(p=>!d.items.some(i=>i.pid===p.id)).slice(0,3);
  const sh=document.getElementById('share');sh.hidden=false;
  sh.innerHTML=`<h2 style="font-size:17px">よかったらシェアしてください</h2><div class="row"><a class="btn" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=${text}&url=${shareUrl}">Xでシェア</a><a class="btn line" target="_blank" rel="noopener" href="https://social-plugins.line.me/lineit/share?url=${shareUrl}">LINEで送る</a><a class="btn" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${shareUrl}">Facebook</a></div>${others.length?`<h2 style="font-size:17px;margin-top:6px">こちらもおすすめ</h2><div class="grid">${others.map(p=>`<a class="card" href="item.html?id=${encodeURIComponent(p.id)}"><div class="img">${p.image?`<img src="${esc(p.image)}" alt="" loading="lazy">`:''}</div><div class="body"><span class="t">${esc(p.title)}</span><span class="p">${p.price?yen(p.price):'無料'}</span></div></a>`).join('')}</div>`:''}${S.lineUrl?`<p style="margin:0">新しいゲームやコンテンツのお知らせは、<a href="${esc(S.lineUrl)}" target="_blank" rel="noopener">LINE公式アカウント</a>でお届けしています。</p>`:''}`;
})();
</script>
</body>
</html>
